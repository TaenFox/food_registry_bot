<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Дневник питания</title>
  <link rel="stylesheet" href="assets/diary.css">
  <link rel="stylesheet" href="assets/report.css">
  <script defer src="https://telegram.org/js/telegram-web-app.js"></script>
  <script defer src="assets/report.js"></script>
  <script defer src="assets/diary.js"></script>
</head>
<body id="diary-trends">
  <main class="phone">
    <p id="status" role="status">Загрузка…</p>
    <article id="diary" aria-labelledby="diary-date" hidden>
      <h1 id="diary-date"><time></time></h1>
      <figure aria-label="Калории, белки, жиры и углеводы в процентах от целей выбранных дней">
        <p class="unit">% от цели дня</p>
        <div class="graph">
          <div class="scale" aria-hidden="true"></div>
          <div class="plot">
            <div class="focus-column" aria-hidden="true"></div>
            <svg viewBox="0 0 400 200" preserveAspectRatio="none" role="img" aria-label="Динамика КБЖУ. Точные значения доступны по датам и метрикам под графиком."></svg>
          </div>
        </div>
        <div class="dates" role="group" aria-label="Выбрать пищевой день"></div>
        <p id="plot-empty" class="notes" hidden></p>
        <ul class="legend" aria-label="Уточнить значения выбранного дня"></ul>
        <div class="notes">
          <span id="goal-key" hidden><i class="goal-key" aria-hidden="true"></i>Цель 100%</span>
          <span id="threshold-key"><i class="band-key" aria-hidden="true"></i><span></span></span>
          <span><i class="dash-key" aria-hidden="true"></i>День ещё идёт</span>
        </div>
        <p id="metric-detail" class="notes" aria-live="polite" hidden></p>
      </figure>
      <p id="action-status" class="meal-note" role="status" hidden></p>
      <section class="meals" aria-label="Приёмы пищи за выбранный день"></section>
    </article>
    <article id="report" aria-labelledby="report-title" hidden>
      <h1 id="report-title">Отчёт за период</h1>
      <div class="report-periods" aria-label="Длина периода" role="group">
        <button type="button" data-groups="2" aria-pressed="true">2 группы<span></span></button>
        <button type="button" data-groups="4" aria-pressed="false">4 группы<span></span></button>
        <button type="button" data-groups="8" aria-pressed="false">8 групп<span></span></button>
      </div>
      <p class="report-dates" aria-live="polite"></p>
      <p class="report-note">Обычно группа длится 4 пищевых дня. Текущая учитывается по сегодня.</p>
      <div class="report-status">
        <p role="status"></p>
        <button type="button" class="report-retry" hidden>Повторить</button>
      </div>
      <div class="report-results" hidden>
        <section aria-labelledby="report-summary-title">
          <h2 id="report-summary-title">Сводка</h2>
          <div class="report-metric-head" aria-hidden="true"><span>Метрика</span><span>В среднем</span><span>В цели</span></div>
          <div class="report-metrics" role="group" aria-label="Выбрать метрику для графика"></div>
          <p class="report-coverage report-note" aria-live="polite"></p>
        </section>
        <section class="report-dynamics" aria-labelledby="report-dynamics-title">
          <h2 id="report-dynamics-title">Динамика</h2>
          <div class="report-chart" role="group" aria-labelledby="report-dynamics-title">
            <div class="report-axis" aria-hidden="true"></div>
            <div class="report-plot">
              <div class="report-gridlines" aria-hidden="true"></div>
              <div class="report-bars"></div>
            </div>
          </div>
          <p class="report-key report-note">
            <span class="report-goal-key"><i aria-hidden="true"></i>Цель</span>
            <span class="report-tolerance-key"><i aria-hidden="true"></i><span></span></span>
            <span class="report-current-key"><i aria-hidden="true"></i>Текущая группа</span>
            <span class="report-missing-key" hidden>— Нет данных</span>
          </p>
          <div class="report-detail" aria-live="polite"></div>
        </section>
      </div>
    </article>
    <footer id="screen-navigation" aria-label="Навигация по приложению" hidden>
      <button type="button" class="screen-picker" aria-expanded="false" aria-controls="screen-options">
        <span>Дневник</span><i aria-hidden="true"></i>
      </button>
      <nav id="screen-options" aria-label="Разделы приложения" hidden>
        <button type="button" data-screen="diary" aria-current="page">Дневник</button>
        <button type="button" data-screen="report">Отчёты</button>
      </nav>
    </footer>
  </main>
</body>
</html>
