[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "food-registry-bot"
version = "0.1.0"
description = "Telegram bot for tracking nutrition, water, and workouts."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "aiogram>=3.20,<4.0",
    "alembic>=1.16,<2.0",
    "pydantic-settings>=2.8,<3.0",
    "psycopg[binary]>=3.2,<4.0",
    "sqlalchemy>=2.0,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.26,<1.0",
    "ruff>=0.11,<1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.setuptools.packages.find]
where = ["src"]
