services:
  postgres:
    image: postgres:16-alpine
    container_name: food_registry_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-food_registry}
      POSTGRES_USER: ${POSTGRES_USER:-food_registry}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-food_registry}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-food_registry} -d ${POSTGRES_DB:-food_registry}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
