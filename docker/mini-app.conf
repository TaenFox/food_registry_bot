server {
    listen 80;
    root /usr/share/nginx/html;

    location / {
        add_header Cache-Control "no-store" always;
    }

    location ~ ^/api/(diary|report|settings|entries)$ {
        resolver 127.0.0.11 valid=10s;
        set $mini_app_upstream http://bot:8081;
        proxy_pass $mini_app_upstream$request_uri;
    }
}
